spring:
  application:
    name: licitagestor

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/licitagestor}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway controla o schema, JPA só valida
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

logging:
  level:
    com.licitagestor: DEBUG
    org.springframework.security: INFO